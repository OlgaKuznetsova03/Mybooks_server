{% if request.resolver_match.url_name != "login" and request.resolver_match.url_name != "signup" %}
  {% if not request.user.is_authenticated or not request.user.profile.has_active_premium %}
    <aside class="site-ad-slot" data-site-ad-slot aria-label="Реклама">
      <div class="site-ad-slot__inner">
        <span class="site-ad-slot__label">Реклама</span>
        <div id="yandex_rtb_R-A-17641153-2" class="site-ad-slot__banner"></div>
      </div>
    </aside>

    <style>
      .site-ad-slot {
        width: 100%;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        background: var(--bs-body-bg, #fff);
        transition: opacity .2s ease;
      }

      .site-ad-slot.is-ready {
        max-height: 32rem;
        padding: .75rem max(1rem, env(safe-area-inset-left)) 0;
        opacity: 1;
      }

      .site-ad-slot__inner {
        position: relative;
        width: min(100%, 1320px);
        min-height: 5.5rem;
        margin: 0 auto;
        padding: 1.25rem .75rem .5rem;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--bs-border-color, #dfe5e1) 82%, transparent);
        border-radius: .75rem;
        background: color-mix(in srgb, var(--bs-tertiary-bg, #f7f9f8) 88%, transparent);
      }

      .site-ad-slot__label {
        position: absolute;
        top: .25rem;
        left: .75rem;
        color: var(--bs-secondary-color, #6c757d);
        font-size: .6875rem;
        line-height: 1;
      }

      .site-ad-slot__banner {
        width: 100%;
        min-width: 0;
        text-align: center;
      }

      @media (max-width: 575.98px) {
        .site-ad-slot.is-ready {
          max-height: 8.25rem;
          padding-top: .5rem;
        }

        .site-ad-slot__inner {
          height: 7.5rem;
          min-height: 0;
          max-height: 7.5rem;
          padding-inline: .35rem;
          border-radius: .625rem;
        }

        .site-ad-slot__banner {
          height: 6.25rem;
          max-height: 6.25rem;
          overflow: hidden;
        }
      }
    </style>

    <script>
      (() => {
        const slot = document.currentScript.previousElementSibling.previousElementSibling;
        const banner = slot?.querySelector('#yandex_rtb_R-A-17641153-2');
        if (!slot || !banner) return;

        let revealed = false;
        const reveal = () => {
          if (revealed || !banner.childNodes.length) return;
          revealed = true;
          slot.classList.add('is-ready');
          observer.disconnect();
        };
        const observer = new MutationObserver(reveal);
        observer.observe(banner, { childList: true, subtree: true });

        window.yaContextCb = window.yaContextCb || [];
        window.yaContextCb.push(() => {
          try {
            const result = Ya.Context.AdvManager.render({
              blockId: 'R-A-17641153-2',
              renderTo: 'yandex_rtb_R-A-17641153-2',
            });
            if (result && typeof result.then === 'function') {
              result.then(() => window.requestAnimationFrame(reveal))
                .catch(() => observer.disconnect());
            }
          } catch (error) {
            observer.disconnect();
          }
        });

        const scriptId = 'yandex-context-script';
        if (!document.getElementById(scriptId)) {
          const script = document.createElement('script');
          script.id = scriptId;
          script.src = 'https://yandex.ru/ads/system/context.js';
          script.async = true;
          document.head.appendChild(script);
        }

      })();
    </script>
  {% endif %}
{% endif %}
